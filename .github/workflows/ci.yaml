name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Action references intentionally use version tags instead of commit SHAs.
# This is an explicit maintainability tradeoff.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.5.6
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: high

  check:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Socket Firewall
        uses: socketdev/action@v1
        with:
          mode: firewall

      - name: Seed test database
        run: psql "$TEST_DB_URL" -f db/init-db.sql
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Unlock git-crypt
        run: |
          sudo apt-get install -y git-crypt
          echo "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d | git-crypt unlock -

      - name: Generate Cloudflare types
        run: pnpm --filter @riposte/web run cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build staging
        if: github.ref_name == 'staging' || github.base_ref == 'staging'
        run: pnpm build

      - name: Build prod
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: pnpm build:prod
